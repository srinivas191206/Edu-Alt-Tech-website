<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edu Alt Tech | Behavioral Intelligence Infrastructure</title>
    <link rel="icon" type="image/png" href="/edulogo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html, body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
            width: 100%;
            position: relative;
            background-color: #020617;
            color: #ffffff;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Outfit', sans-serif;
            letter-spacing: -0.02em;
        }
        
        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        
        .glow-text {
            text-shadow: 0 0 20px rgba(0, 255, 157, 0.3);
        }
        
        .glow-border {
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.15), inset 0 0 15px rgba(0, 255, 157, 0.05);
            border: 1px solid rgba(0, 255, 157, 0.2);
        }
        
        .cinematic-gradient {
            background: radial-gradient(circle at center, rgba(0, 255, 157, 0.1) 0%, rgba(2, 6, 23, 0) 70%);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 4s ease-in-out infinite;
        }
</style>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          heading: ['Outfit', 'sans-serif'],
        },
        colors: {
          brand: {
            50: '#f0fdf4',
            100: '#dcfce7',
            400: '#4ade80',
            500: '#22c55e',
            600: '#16a34a',
            900: '#14532d',
          },
          neon: {
            emerald: '#00ff9d',
            blue: '#00f0ff',
            violet: '#8b5cf6'
          }
        }
      }
    }
  }
</script>
