<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduAltTech | Education Technology & Resource Platform</title>
    <link rel="icon" type="image/png" href="/edulogo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
            width: 100%;
            position: relative;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Poppins', sans-serif;
        }
        .bg-primary { background-color: #90EE90; }
        .text-primary { color: #90EE90; }
        .border-primary { border-color: #90EE90; }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float-slow {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-10px) rotate(2deg); }
            66% { transform: translateY(5px) rotate(-1deg); }
        }
        .animate-float-slow {
            animation: float-slow 12s ease-in-out infinite;
        }
        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -20px) scale(1.05); }
            50% { transform: translate(-15px, -35px) scale(0.95); }
            75% { transform: translate(-30px, 10px) scale(1.02); }
        }
        .animate-drift {
            animation: drift 20s ease-in-out infinite;
        }
        @keyframes drift-reverse {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(-25px, 15px) scale(0.97); }
            50% { transform: translate(20px, 30px) scale(1.03); }
            75% { transform: translate(25px, -15px) scale(0.98); }
        }
        .animate-drift-reverse {
            animation: drift-reverse 25s ease-in-out infinite;
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .animate-pulse-soft {
            animation: pulse-soft 3s ease-in-out infinite;
        }
        @keyframes shimmer-text {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animate-shimmer-text {
            background-size: 200% auto;
            animation: shimmer-text 4s ease infinite;
        }
        @keyframes blur-oscillate {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }
        .animate-blur-oscillate {
            animation: blur-oscillate 6s ease-in-out infinite;
        }

        /* ═════════════════════════════════════════════ Premium Redesign Animations */
        @keyframes grid-scroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }
        .animate-grid-scroll {
            animation: grid-scroll 18s linear infinite;
        }

        @keyframes morph-blob {
            0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            33% { border-radius: 70% 30% 50% 50% / 30% 60% 40% 70%; }
            66% { border-radius: 50% 60% 30% 70% / 60% 30% 70% 40%; }
        }
        .animate-morph-blob {
            animation: morph-blob 16s ease-in-out infinite;
        }

        @keyframes rotate-gradient {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-rotate-gradient {
            animation: rotate-gradient 6s linear infinite;
        }

        @keyframes soundwave {
            0%, 100% { height: 4px; }
            50% { height: 28px; }
        }
        .soundwave-bar {
            animation: soundwave 1.2s ease-in-out infinite;
        }

        /* Orbits for language symbols in space */
        @keyframes orbital-spin-1 {
            0% { transform: rotate(0deg) translate(140px) rotate(0deg); }
            100% { transform: rotate(360deg) translate(140px) rotate(-360deg); }
        }
        @keyframes orbital-spin-2 {
            0% { transform: rotate(72deg) translate(140px) rotate(-72deg); }
            100% { transform: rotate(432deg) translate(140px) rotate(-432deg); }
        }
        @keyframes orbital-spin-3 {
            0% { transform: rotate(144deg) translate(140px) rotate(-144deg); }
            100% { transform: rotate(504deg) translate(140px) rotate(-504deg); }
        }
        @keyframes orbital-spin-4 {
            0% { transform: rotate(216deg) translate(140px) rotate(-216deg); }
            100% { transform: rotate(576deg) translate(140px) rotate(-576deg); }
        }
        @keyframes orbital-spin-5 {
            0% { transform: rotate(288deg) translate(140px) rotate(-288deg); }
            100% { transform: rotate(648deg) translate(140px) rotate(-648deg); }
        }
        .animate-orbit-1 { animation: orbital-spin-1 30s linear infinite; }
        .animate-orbit-2 { animation: orbital-spin-2 30s linear infinite; }
        .animate-orbit-3 { animation: orbital-spin-3 30s linear infinite; }
        .animate-orbit-4 { animation: orbital-spin-4 30s linear infinite; }
        .animate-orbit-5 { animation: orbital-spin-5 30s linear infinite; }

        /* Premium CSS utilities */
        .bg-grid-pattern {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
        }
        .glow-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.04);
        }
        .text-glow-emerald {
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        @media (prefers-reduced-motion: reduce) {
            .animate-float, .animate-float-slow, .animate-drift, .animate-drift-reverse,
            .animate-pulse-soft, .animate-shimmer-text, .animate-blur-oscillate,
            .animate-grid-scroll, .animate-morph-blob, .animate-rotate-gradient,
            .animate-orbit-1, .animate-orbit-2, .animate-orbit-3, .animate-orbit-4, .animate-orbit-5 {
                animation: none !important;
            }
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0fdf4',
                100: '#dcfce7',
                400: '#4ade80',
                500: '#22c55e',
                600: '#16a34a',
                900: '#14532d',
              }
            }
          }
        }
      }
    </script>
    <script type="importmap">
    {
      "imports": {
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4",
        "firebase/": "https://esm.sh/firebase@^12.9.0/",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
        "react/": "https://esm.sh/react@^19.2.4/",
        "react": "https://esm.sh/react@^19.2.4",
        "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
        "vite": "https://esm.sh/vite@^7.3.1",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "@google/generative-ai": "https://esm.sh/@google/generative-ai@^0.21.0"
      }
    }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 transition-colors duration-300">
    <div id="root"></div>
    <script async src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
