    <!-- Hamster loader — all CSS scoped by unique IDs, zero class-name conflicts with Tailwind -->
    <style>
      #edu-loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f8fafc;gap:1.5rem}
      #edu-loader-label{font-family:Inter,sans-serif;font-size:.95rem;color:#64748b;letter-spacing:.05em;margin:0}

      /* The wheel container */
      #edu-wah{position:relative;width:168px;height:168px;font-size:14px}

      /* Every child needs absolute positioning — target by ID children only */
      #edu-wah>#edu-wheel,
      #edu-wah>#edu-spoke,
      #edu-wah>#edu-hamster{position:absolute}

      #edu-wheel,#edu-spoke{border-radius:50%;top:0;left:0;width:100%;height:100%}
      #edu-wheel{background:radial-gradient(100% 100% at center,hsla(0,0%,60%,0) 47.8%,hsl(0,0%,60%) 48%);z-index:2}
      #edu-spoke{animation:eduspoke 1s linear infinite;background:radial-gradient(100% 100% at center,hsl(0,0%,60%) 4.8%,hsla(0,0%,60%,0) 5%),linear-gradient(hsla(0,0%,55%,0) 46.9%,hsl(0,0%,65%) 47% 52.9%,hsla(0,0%,65%,0) 53%) 50% 50%/99% 99% no-repeat;z-index:0}

      /* Hamster group */
      #edu-hamster{animation:eduham 1s ease-in-out infinite;top:50%;left:calc(50% - 49px);width:98px;height:52.5px;transform:rotate(4deg) translate(-11.2px,25.9px);transform-origin:50% 0;z-index:1}
      #edu-hamster *{position:absolute}

      /* Head */
      #edu-hhead{animation:eduhamhead 1s ease-in-out infinite;background:hsl(30,90%,55%);border-radius:70% 30% 0 100%/40% 25% 25% 60%;box-shadow:0 -3.5px 0 hsl(30,90%,80%) inset,10.5px -21.7px 0 hsl(30,90%,90%) inset;top:0;left:-28px;width:38.5px;height:35px;transform-origin:100% 50%}
      #edu-hear{animation:eduhamear 1s ease-in-out infinite;background:hsl(0,90%,85%);border-radius:50%;box-shadow:-3.5px 0 hsl(30,90%,55%) inset;top:-3.5px;right:-3.5px;width:10.5px;height:10.5px;transform-origin:50% 75%}
      #edu-heye{animation:eduhameye 1s linear infinite;background:hsl(0,0%,0%);border-radius:50%;top:5.25px;left:17.5px;width:7px;height:7px}
      #edu-hnose{background:hsl(0,90%,75%);border-radius:35% 65% 85% 15%/70% 50% 50% 30%;top:10.5px;left:0;width:2.8px;height:3.5px}

      /* Body */
      #edu-hbody{animation:eduhambody 1s ease-in-out infinite;background:hsl(30,90%,90%);border-radius:50% 30% 50% 30%/15% 60% 40% 40%;box-shadow:1.4px 10.5px 0 hsl(30,90%,55%) inset,2.1px -7px 0 hsl(30,90%,80%) inset;top:3.5px;left:28px;width:63px;height:42px;transform-origin:17% 50%;transform-style:preserve-3d}

      /* Front limbs */
      #edu-hlfr,#edu-hlfl{clip-path:polygon(0 0,100% 0,70% 80%,60% 100%,0% 100%,40% 80%);top:28px;left:7px;width:14px;height:21px;transform-origin:50% 0}
      #edu-hlfr{animation:eduhamfrlimb 1s linear infinite;background:linear-gradient(hsl(30,90%,80%) 80%,hsl(0,90%,75%) 80%);transform:rotate(15deg) translateZ(-1px)}
      #edu-hlfl{animation:eduhamfllimb 1s linear infinite;background:linear-gradient(hsl(30,90%,90%) 80%,hsl(0,90%,85%) 80%);transform:rotate(15deg)}

      /* Back limbs */
      #edu-hlbr,#edu-hlbl{border-radius:10.5px 10.5px 0 0;clip-path:polygon(0 0,100% 0,100% 30%,70% 90%,70% 100%,30% 100%,40% 90%,0% 30%);top:14px;left:39.2px;width:21px;height:35px;transform-origin:50% 30%}
      #edu-hlbr{animation:eduhambrlimb 1s linear infinite;background:linear-gradient(hsl(30,90%,80%) 90%,hsl(0,90%,75%) 90%);transform:rotate(-25deg) translateZ(-1px)}
      #edu-hlbl{animation:eduhamBllimb 1s linear infinite;background:linear-gradient(hsl(30,90%,90%) 90%,hsl(0,90%,85%) 90%);transform:rotate(-25deg)}

      /* Tail */
      #edu-htail{animation:eduhamtail 1s linear infinite;background:hsl(0,90%,85%);border-radius:3.5px 50% 50% 3.5px;box-shadow:0 -2.8px 0 hsl(0,90%,75%) inset;top:21px;right:-7px;width:14px;height:7px;transform:rotate(30deg) translateZ(-1px);transform-origin:3.5px 3.5px}

      @keyframes eduham{from,to{transform:rotate(4deg) translate(-11.2px,25.9px)}50%{transform:rotate(0) translate(-11.2px,25.9px)}}
      @keyframes eduhamhead{from,25%,50%,75%,to{transform:rotate(0)}12.5%,37.5%,62.5%,87.5%{transform:rotate(8deg)}}
      @keyframes eduhameye{from,90%,to{transform:scaleY(1)}95%{transform:scaleY(0)}}
      @keyframes eduhamear{from,25%,50%,75%,to{transform:rotate(0)}12.5%,37.5%,62.5%,87.5%{transform:rotate(12deg)}}
      @keyframes eduhambody{from,25%,50%,75%,to{transform:rotate(0)}12.5%,37.5%,62.5%,87.5%{transform:rotate(-2deg)}}
      @keyframes eduhamfrlimb{from,25%,50%,75%,to{transform:rotate(50deg) translateZ(-1px)}12.5%,37.5%,62.5%,87.5%{transform:rotate(-30deg) translateZ(-1px)}}
      @keyframes eduhamfllimb{from,25%,50%,75%,to{transform:rotate(-30deg)}12.5%,37.5%,62.5%,87.5%{transform:rotate(50deg)}}
      @keyframes eduhambrlimb{from,25%,50%,75%,to{transform:rotate(-60deg) translateZ(-1px)}12.5%,37.5%,62.5%,87.5%{transform:rotate(20deg) translateZ(-1px)}}
      @keyframes eduhamBllimb{from,25%,50%,75%,to{transform:rotate(20deg)}12.5%,37.5%,62.5%,87.5%{transform:rotate(-60deg)}}
      @keyframes eduhamtail{from,25%,50%,75%,to{transform:rotate(30deg) translateZ(-1px)}12.5%,37.5%,62.5%,87.5%{transform:rotate(10deg) translateZ(-1px)}}
      @keyframes eduspoke{from{transform:rotate(0)}to{transform:rotate(-1turn)}}
    </style>

    <!-- Page loader — uses only IDs, no class names, immune to Tailwind preflight -->

        <div id="edu-hamster">

            <div id="edu-hlbl"></div>
            <div id="edu-htail"></div>

        </div>
        <div id="edu-spoke"></div>
      </div>
      <p id="edu-loader-label">Loading EduAltTech…</p>
    </div>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script defer src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Remove loader once React mounts -->
    <script>
      (function(){
        var root=document.getElementById('root');
        var loader=document.getElementById('edu-loader');
        if(!root||!loader)return;
        var ob=new MutationObserver(function(){
          if(root.children.length>0){
            loader.style.opacity='0';
            loader.style.transition='opacity 0.4s ease';
            setTimeout(function(){loader.remove();},400);
            ob.disconnect();
          }
        });
        ob.observe(root,{childList:true});
      })();
    </script>
</body>
