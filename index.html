    <!--
      CRITICAL: Hamster loader styles are fully inlined here so they render
      BEFORE Tailwind's preflight CSS loads (which would reset position/background).
      All selectors are scoped to #page-loader to prevent any conflicts.
      Keyframe names are prefixed with "pg" to avoid collisions with index.css.
    -->
    <style>
      #page-loader {
        position: fixed !important;
        inset: 0;
        z-index: 9999;
        display: flex !important;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        gap: 1.5rem;
      }
      #page-loader * { box-sizing: border-box; }
      #page-loader .wah {
        --dur: 1s;
        position: relative !important;
        width: 12em;
        height: 12em;
        font-size: 14px;
        display: block;
      }
      #page-loader .wah-wheel,
      #page-loader .wah-hamster,
      #page-loader .wah-hamster div,
      #page-loader .wah-spoke {
        position: absolute !important;
        margin: 0;
        padding: 0;
      }
      #page-loader .wah-wheel,
      #page-loader .wah-spoke {
        border-radius: 50%;
        top: 0; left: 0;
        width: 100%; height: 100%;
      }
      #page-loader .wah-wheel {
        background: radial-gradient(100% 100% at center, hsla(0,0%,60%,0) 47.8%, hsl(0,0%,60%) 48%);
        z-index: 2;
      }
      #page-loader .wah-hamster {
        animation: pgHamster var(--dur) ease-in-out infinite;
        top: 50%;
        left: calc(50% - 3.5em);
        width: 7em; height: 3.75em;
        transform: rotate(4deg) translate(-0.8em, 1.85em);
        transform-origin: 50% 0;
        z-index: 1;
      }
      #page-loader .wah-head {
        animation: pgHamsterHead var(--dur) ease-in-out infinite;
        background: hsl(30,90%,55%) !important;
        border-radius: 70% 30% 0 100% / 40% 25% 25% 60%;
        box-shadow: 0 -0.25em 0 hsl(30,90%,80%) inset, 0.75em -1.55em 0 hsl(30,90%,90%) inset;
        top: 0; left: -2em;
        width: 2.75em; height: 2.5em;
        transform-origin: 100% 50%;
      }
      #page-loader .wah-ear {
        animation: pgHamsterEar var(--dur) ease-in-out infinite;
        background: hsl(0,90%,85%) !important;
        border-radius: 50%;
        box-shadow: -0.25em 0 hsl(30,90%,55%) inset;
        top: -0.25em; right: -0.25em;
        width: 0.75em; height: 0.75em;
        transform-origin: 50% 75%;
      }
      #page-loader .wah-eye {
        animation: pgHamsterEye var(--dur) linear infinite;
        background: hsl(0,0%,0%) !important;
        border-radius: 50%;
        top: 0.375em; left: 1.25em;
        width: 0.5em; height: 0.5em;
      }
      #page-loader .wah-nose {
        background: hsl(0,90%,75%) !important;
        border-radius: 35% 65% 85% 15% / 70% 50% 50% 30%;
        top: 0.75em; left: 0;
        width: 0.2em; height: 0.25em;
      }
      #page-loader .wah-body {
        animation: pgHamsterBody var(--dur) ease-in-out infinite;
        background: hsl(30,90%,90%) !important;
        border-radius: 50% 30% 50% 30% / 15% 60% 40% 40%;
        box-shadow: 0.1em 0.75em 0 hsl(30,90%,55%) inset, 0.15em -0.5em 0 hsl(30,90%,80%) inset;
        top: 0.25em; left: 2em;
        width: 4.5em; height: 3em;
        transform-origin: 17% 50%;
        transform-style: preserve-3d;
      }
      #page-loader .wah-limb-fr,
      #page-loader .wah-limb-fl {
        clip-path: polygon(0 0,100% 0,70% 80%,60% 100%,0% 100%,40% 80%);
        top: 2em; left: 0.5em;
        width: 1em; height: 1.5em;
        transform-origin: 50% 0;
      }
      #page-loader .wah-limb-fr {
        animation: pgHamsterFRLimb var(--dur) linear infinite;
        background: linear-gradient(hsl(30,90%,80%) 80%, hsl(0,90%,75%) 80%) !important;
        transform: rotate(15deg) translateZ(-1px);
      }
      #page-loader .wah-limb-fl {
        animation: pgHamsterFLLimb var(--dur) linear infinite;
        background: linear-gradient(hsl(30,90%,90%) 80%, hsl(0,90%,85%) 80%) !important;
        transform: rotate(15deg);
      }
      #page-loader .wah-limb-br,
      #page-loader .wah-limb-bl {
        border-radius: 0.75em 0.75em 0 0;
        clip-path: polygon(0 0,100% 0,100% 30%,70% 90%,70% 100%,30% 100%,40% 90%,0% 30%);
        top: 1em; left: 2.8em;
        width: 1.5em; height: 2.5em;
        transform-origin: 50% 30%;
      }
      #page-loader .wah-limb-br {
        animation: pgHamsterBRLimb var(--dur) linear infinite;
        background: linear-gradient(hsl(30,90%,80%) 90%, hsl(0,90%,75%) 90%) !important;
        transform: rotate(-25deg) translateZ(-1px);
      }
      #page-loader .wah-limb-bl {
        animation: pgHamsterBLLimb var(--dur) linear infinite;
        background: linear-gradient(hsl(30,90%,90%) 90%, hsl(0,90%,85%) 90%) !important;
        transform: rotate(-25deg);
      }
      #page-loader .wah-tail {
        animation: pgHamsterTail var(--dur) linear infinite;
        background: hsl(0,90%,85%) !important;
        border-radius: 0.25em 50% 50% 0.25em;
        box-shadow: 0 -0.2em 0 hsl(0,90%,75%) inset;
        top: 1.5em; right: -0.5em;
        width: 1em; height: 0.5em;
        transform: rotate(30deg) translateZ(-1px);
        transform-origin: 0.25em 0.25em;
      }
      #page-loader .wah-spoke {
        animation: pgSpoke var(--dur) linear infinite;
        background:
          radial-gradient(100% 100% at center, hsl(0,0%,60%) 4.8%, hsla(0,0%,60%,0) 5%),
          linear-gradient(hsla(0,0%,55%,0) 46.9%, hsl(0,0%,65%) 47% 52.9%, hsla(0,0%,65%,0) 53%)
            50% 50% / 99% 99% no-repeat;
      }
      @keyframes pgHamster {
        from, to { transform: rotate(4deg) translate(-0.8em, 1.85em); }
        50%       { transform: rotate(0) translate(-0.8em, 1.85em); }
      }
      @keyframes pgHamsterHead {
        from, 25%, 50%, 75%, to   { transform: rotate(0); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(8deg); }
      }
      @keyframes pgHamsterEye {
        from, 90%, to { transform: scaleY(1); }
        95%           { transform: scaleY(0); }
      }
      @keyframes pgHamsterEar {
        from, 25%, 50%, 75%, to   { transform: rotate(0); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(12deg); }
      }
      @keyframes pgHamsterBody {
        from, 25%, 50%, 75%, to   { transform: rotate(0); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(-2deg); }
      }
      @keyframes pgHamsterFRLimb {
        from, 25%, 50%, 75%, to   { transform: rotate(50deg) translateZ(-1px); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(-30deg) translateZ(-1px); }
      }
      @keyframes pgHamsterFLLimb {
        from, 25%, 50%, 75%, to   { transform: rotate(-30deg); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(50deg); }
      }
      @keyframes pgHamsterBRLimb {
        from, 25%, 50%, 75%, to   { transform: rotate(-60deg) translateZ(-1px); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(20deg) translateZ(-1px); }
      }
      @keyframes pgHamsterBLLimb {
        from, 25%, 50%, 75%, to   { transform: rotate(20deg); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(-60deg); }
      }
      @keyframes pgHamsterTail {
        from, 25%, 50%, 75%, to   { transform: rotate(30deg) translateZ(-1px); }
        12.5%, 37.5%, 62.5%, 87.5% { transform: rotate(10deg) translateZ(-1px); }
      }
      @keyframes pgSpoke {
        from { transform: rotate(0); }
        to   { transform: rotate(-1turn); }
      }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 transition-colors duration-300">

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script defer src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Hide loader once React has mounted -->
    <script>
      (function() {
        var root = document.getElementById('root');
        var loader = document.getElementById('page-loader');
        if (!root || !loader) return;
        var observer = new MutationObserver(function() {
          if (root.children.length > 0) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.4s ease';
            setTimeout(function() { loader.remove(); }, 400);
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
      })();
    </script>
